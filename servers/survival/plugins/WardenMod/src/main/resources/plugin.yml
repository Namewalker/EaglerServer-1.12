name: WardenMod
main: com.shadowlord.wardenmod.WardenModPlugin
version: 1.0.0
author: ShadowLord
api-version: 1.12

commands:
  warden:
    description: Summon a Warden
    usage: /warden
    permission: wardenmod.warden
  shrieker:
    description: Get a Shrieker block
    usage: /shrieker
    permission: wardenmod.shrieker
  skulk:
    description: Get a Skulk block
    usage: /skulk
    permission: wardenmod.skulk
  skulksensor:
    description: Get a Skulk Sensor block
    usage: /skulksensor
    permission: wardenmod.skulksensor

permissions:
  wardenmod.warden:
    description: Permission to summon Warden
    default: op
  wardenmod.shrieker:
    description: Permission to get Shrieker
    default: op
  wardenmod.skulk:
    description: Permission to get Skulk
    default: op
  wardenmod.skulksensor:
    description: Permission to get Skulk Sensor
    default: op

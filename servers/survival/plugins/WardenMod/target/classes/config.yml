# WardenMod Configuration
# Version: 1.1.0

# Warden Settings
warden:
  # Health of Warden boss (default: 500)
  health: 500
  
  # Damage per attack (default: 21)
  damage: 21.0
  
  # Enable particle effects
  particle-effects: true

# Achievement Settings
achievements:
  # Enable achievement system
  enabled: true
  
  # Show achievement messages
  show-messages: true

# Block Settings
blocks:
  shrieker: PRISMARINE
  skulk: WOOL
  skulk-sensor: PURPUR_PILLAR

# Message Settings
messages:
  achievement-prefix: "§6✓ Achievement Unlocked: "
  plugin-enable: "WardenMod enabled with achievement system!"
  plugin-disable: "WardenMod disabled"

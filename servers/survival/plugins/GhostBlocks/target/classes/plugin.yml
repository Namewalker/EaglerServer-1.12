name: GhostBlocks
main: com.shadowlord.ghostblocks.GhostBlocksPlugin
version: 1.0.0
api-version: 1.12
author: shadowlord
description: Persistent client-side ghost block illusions for traps and hidden passages.

commands:
  ghostblocks:
    description: GhostBlocks admin and give commands
    usage: /ghostblocks <give|list|clear|reload|debug>
    aliases: [gb, ghost]
permissions:
  ghostblocks.admin:
    description: Allows managing ghost blocks
    default: op
  ghostblocks.give:
    description: Allows giving ghost block items
    default: op
